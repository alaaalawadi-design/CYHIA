##############################################################################
#  cy_hia — one HTML UI over two GPU ComfyUI backends
#
#    comfy-replace   GPU 0   SCAIL-2 replacement      ComfyUI :8136 (internal)
#    comfy-animate   GPU 1   WAN 2.2 Animate          ComfyUI :8134 (internal)
#    ui              ---     the only published port          :7860
#
#  The two backends run ComfyUI *only*. The UI is a separate container, so it
#  can be restarted without evicting models from either GPU.
#
#  This file does not touch comfyui-wan-docker/docker-compose.yml, which stays
#  as the rollback path. That old stack occupies GPU 1 and binds 8135/7835, so
#  it must be stopped before comfy-animate can start — but comfy-replace on
#  GPU 0 runs alongside it untouched.
#
#    docker compose up -d comfy-replace     # backend only, for testing
#    docker compose up -d                   # everything
#    docker compose logs -f comfy-replace
##############################################################################

x-comfy-common: &comfy-common
  restart: unless-stopped
  # ComfyUI mmaps large safetensors; the default 64 MB /dev/shm is not enough.
  shm_size: "32gb"
  networks: [cyhia]
  environment: &comfy-env
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    # Inside the container only one GPU is visible, so it is always cuda:0.
    CUDA_DEVICE: "0"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    # Everything is mounted; nothing should fetch weights at run time.
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"

services:

  # ══════════════════════════════════════════════════════════════════════════
  # GPU 0 — SCAIL-2 character replacement
  #
  # Runs nouran_Rep's own custom nodes, models and venv (mounted), so it is
  # identical to that install. The image supplies the OS, Python 3.12.3 and system libs.
  # ══════════════════════════════════════════════════════════════════════════
  comfy-replace:
    build:
      context: ./docker
      dockerfile: Dockerfile.replace
    image: scail-replace:latest
    container_name: cyhia_comfy_replace
    <<: *comfy-common

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    environment:
      <<: *comfy-env
      NVIDIA_VISIBLE_DEVICES: "0"
      COMFY_PORT: "8136"
      # Run on the mounted host venv, not the image's /opt/venv.
      VIRTUAL_ENV: ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/venv
      PATH: ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/venv/bin:/usr/local/cuda/bin:/usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # The host resolves CUDA 12 libraries (bitsandbytes, sam2, the ONNX CUDA
      # provider) through ldconfig; here they come from the mount below.
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/cuda-12.8/targets/x86_64-linux/lib

    # Uncomment to reach ComfyUI directly from the host while debugging.
    # ports:
    #   - "8136:8136"

    volumes:
      # Identical to the host install: every custom node, the models, the
      # host's one local core patch and the venv it runs in are the host's
      # own, mounted read-only so the service can never modify that install.
      #
      # The ComfyUI tree is NOT mounted whole: its .git/config embeds a GitHub
      # token, which must never be visible inside a container. The rest of the
      # core is the image's stock v0.27.0, which differs from the host only in
      # comfy/ops.py (checked with diff -r).
      - ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/ComfyUI/models:/app/ComfyUI/models:ro
      - ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/ComfyUI/custom_nodes:/app/ComfyUI/custom_nodes:ro
      - ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/ComfyUI/comfy/ops.py:/app/ComfyUI/comfy/ops.py:ro
      # The venv must sit at its host path — its scripts and pyvenv.cfg carry it.
      - ${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/venv:${REP_ROOT:-/home/administrator/Disk/nouran_Rep}/venv:ro
      - /usr/local/cuda-12.8:/usr/local/cuda-12.8:ro

      # ── Writable: this service's own input/output, not shared with animate ─
      - ./data/replace/input:/app/ComfyUI/input
      - ./data/replace/output:/app/ComfyUI/output
      - ./data/replace/temp:/app/ComfyUI/temp
      - ./data/replace/user:/app/ComfyUI/user

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8136/system_stats > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start loads a large custom node tree before the port answers.
      start_period: 180s

  # ══════════════════════════════════════════════════════════════════════════
  # GPU 1 — WAN 2.2 Animate  (Phase 3; reuses the existing wan-animate image)
  # ══════════════════════════════════════════════════════════════════════════
  comfy-animate:
    image: wan-animate:latest
    container_name: cyhia_comfy_animate
    <<: *comfy-common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

    environment:
      <<: *comfy-env
      NVIDIA_VISIBLE_DEVICES: "1"
      COMFY_PORT: "8134"

    volumes:
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/diffusion_models:/app/ComfyUI/models/unet:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/text_encoders:/app/ComfyUI/models/clip:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/clip_vision:/app/ComfyUI/models/clip_vision:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/vae:/app/ComfyUI/models/vae:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/loras:/app/ComfyUI/models/loras:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/models/detection:/app/ComfyUI/models/detection:ro
      - ${WAN_ROOT:-/home/administrator/Disk/nouran_wan22}/ComfyUI/custom_nodes:/app/ComfyUI/custom_nodes:ro
      - ./docker/entrypoint-comfy.sh:/app/entrypoint-comfy.sh:ro
      - ./data/animate/input:/app/ComfyUI/input
      - ./data/animate/output:/app/ComfyUI/output
      - ./data/animate/temp:/app/ComfyUI/temp

    entrypoint: ["/app/entrypoint-comfy.sh"]

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8134/system_stats > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ══════════════════════════════════════════════════════════════════════════
  # The UI — no GPU. Phase 5.
  # ══════════════════════════════════════════════════════════════════════════
  ui:
    build:
      context: ./docker
      dockerfile: Dockerfile.ui
    image: cyhia-ui:latest
    container_name: cyhia_ui
    restart: unless-stopped
    networks: [cyhia]

    ports:
      - "${UI_PORT:-7860}:7860"

    environment:
      # Service names on the cyhia network, so the UI needs no host ports.
      ANIMATE_URL: "${ANIMATE_URL:-http://comfy-animate:8134}"
      REPLACE_URL: "${REPLACE_URL:-http://comfy-replace:8136}"
      UI_HOST: "0.0.0.0"
      UI_PORT: "7860"
      OUT_DIR: "/app/outputs"
      GALLERY_DIR: "/app/assets/gallery"
      DOCS_DIR: "/app/assets/documentation"
      # Accounts (app/auth.py; users.db lives in ./data/ui_outputs). Set
      # SIGNUP_CODE to require an invite code, ALLOW_SIGNUP=0 to close sign-up,
      # COOKIE_SECURE=1 once the UI is behind HTTPS.
      SIGNUP_CODE: "${SIGNUP_CODE:-}"
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-1}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"

    volumes:
      # Mounted rather than baked: the UI can be edited and restarted in
      # seconds without touching either GPU container.
      - ./app:/app/app:ro
      - ./workflows:/app/workflows:ro
      - ./assets/gallery:/app/assets/gallery:ro
      - ./assets/documentation:/app/assets/documentation:ro
      - ./data/ui_outputs:/app/outputs

    # Deliberately not `condition: service_healthy` on the backends: the UI
    # shows a per-tab status badge and must come up even when one GPU service
    # is down, so the other tab stays usable.
    depends_on:
      comfy-replace:
        condition: service_started

networks:
  cyhia:
    driver: bridge
