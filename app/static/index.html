<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYHIA — Human Image Animation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%23ffffff%27/%3E%3Cpath d=%27M50 20L24 50l26 30h12L36 50l26-30z%27 fill=%27%233a59d9%27/%3E%3C/svg%3E">
<style>
  /* Tokens taken from cywaf.com (Cyshield brand): blue #1C1998, red #BC0424, light surfaces,
     red->blue "AI gradient". No web font: this UI loads nothing from a CDN. */
  :root {
    --bg: #f7f7fb; --panel: #ffffff; --panel-2: #f0f1f9; --text: #1b1a1a; --muted: #55566a;
    --line: rgba(28,25,152,.10); --line-strong: rgba(28,25,152,.22);
    --accent: #1c1998; --accent-hover: #2621b8; --accent-text: #fff; --red: #bc0424;
    --wordmark: #1c1998;
    --gradient: linear-gradient(90deg, #e84a63 0%, #bc0424 28%, #3a59d9 65%, #1c1998 100%);
    --shadow: 0 8px 24px rgba(28,25,152,.08), 0 2px 6px rgba(28,25,152,.04);
    --ok: #106945; --busy: #b9791f; --bad: #bc0424; --err-bg: #fbe9ec;
    --nav-bg: rgba(255,255,255,.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0a26; --panel: #12103e; --panel-2: #0e0d33; --text: #ececfa; --muted: #9c9dc8;
      --line: rgba(127,162,244,.14); --line-strong: rgba(127,162,244,.3);
      --accent: #3a59d9; --accent-hover: #5b8aff; --accent-text: #fff; --red: #e84a63;
      --wordmark: #ffffff;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --ok: #6ed9a4; --busy: #e6a451; --bad: #ff6b7d; --err-bg: #3a0f1a;
      --nav-bg: rgba(18,16,62,.82);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    font: 15px/1.55 "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(58,89,217,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, rgba(188,4,36,.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 48px; }
  header.brand {
    display: flex; align-items: center; gap: 16px; margin: 0 0 32px; padding: 10px 22px;
    background: var(--nav-bg); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: saturate(160%) blur(18px); box-shadow: var(--shadow);
  }
  header.brand svg { height: 48px; width: auto; display: block; flex: none; }
  header.brand::after { content: ""; order: 3; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .hero { margin: 0 0 28px; }
  .hero h1 { font-size: clamp(28px, 4vw, 42px); letter-spacing: -.02em; line-height: 1.08; font-weight: 600; margin: 0 0 10px; }
  .hero h1 span { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); margin: 0; max-width: 62ch; }

  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 22px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .tabs button {
    font: inherit; font-weight: 500; font-size: 14px; background: none; border: 0; color: var(--muted); cursor: pointer;
    padding: 8px 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: #fff; background: var(--accent); font-weight: 600; box-shadow: 0 10px 30px -12px var(--accent); }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ready { background: var(--ok); } .dot.busy { background: var(--busy); } .dot.offline { background: var(--bad); }

  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .status b { font-weight: 600; }
  .blurb { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }

  .drop {
    display: block; position: relative; border: 1.5px dashed var(--line-strong); border-radius: 8px;
    min-height: 200px; margin-bottom: 14px; cursor: pointer; overflow: hidden;
    background: var(--panel-2);
  }
  .drop:hover { border-color: var(--accent); }
  .drop.over { border-color: var(--accent); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .drop .hint {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 12px;
  }
  .drop .hint strong { color: var(--text); font-weight: 600; }
  .drop img, .drop video { display: block; width: 100%; max-height: 280px; object-fit: contain; background: #000; }
  .drop.has .hint { display: none; }
  .drop .clear {
    position: absolute; top: 6px; right: 6px; z-index: 2; display: none;
    font: inherit; font-size: 12px; border: 0; border-radius: 6px; padding: 3px 8px;
    background: rgba(0,0,0,.6); color: #fff; cursor: pointer;
  }
  .drop.has .clear { display: block; }
  .label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }

  .go {
    width: 100%; font: inherit; font-weight: 600; padding: 13px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 10px 30px -10px var(--accent);
    transition: transform .15s, background .15s;
  }
  .go:not(:disabled):hover { transform: translateY(-1px); background: var(--accent-hover); }
  .go:disabled { opacity: .5; cursor: not-allowed; }

  .result video { width: 100%; max-height: 580px; background: #000; border-radius: 10px; display: block; }
  .empty { color: var(--muted); min-height: 200px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .progress { margin: 0 0 12px; font-size: 14px; }
  .progress .stage { font-weight: 600; }
  .progress .meta { color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--gradient); width: 0; transition: width .2s; }
  /* Indeterminate: no honest overall fraction exists for a ~100-node graph. */
  .bar.spin > i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar.spin > i { animation: none; width: 100%; opacity: .4; } }
  .error { background: var(--err-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; overflow-wrap: anywhere; }
  .dl { display: inline-block; margin-top: 10px; color: var(--accent); }
  .guide { margin: 0 0 20px; }
  .guide > summary {
    cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px;
  }
  .guide > summary::-webkit-details-marker { display: none; }
  .guide > summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
  .guide[open] > summary::before { transform: rotate(90deg); }
  .guide .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 14px; }
  .guide h3 { font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .guide ul { margin: 0; padding: 0; list-style: none; }
  .guide li { padding-left: 22px; position: relative; margin-bottom: 6px; font-size: 14px; }
  .guide li::before { position: absolute; left: 0; font-weight: 700; }
  .guide .do li::before { content: "✓"; color: var(--ok); }
  .guide .avoid li::before { content: "✕"; color: var(--bad); }
  .guide .limits { width: 100%; border-collapse: collapse; font-size: 14px; }
  .guide .limits td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .guide .limits td:first-child { color: var(--muted); padding-right: 12px; white-space: nowrap; }
  .guide .tip { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 14px; }
  .gallery { margin-top: 36px; }
  .gallery h2 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; }
  .gallery > p { color: var(--muted); margin: 0 0 16px; }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .case { padding: 14px; }
  .case h3 { font-size: 16px; margin: 0 0 2px; letter-spacing: -.01em; }
  .case .note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .case .trio { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .case figure { margin: 0; min-width: 0; }
  .case figure.wide { grid-column: 1 / -1; }
  .case figcaption { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .case figure.wide figcaption { color: var(--accent); }
  .case img, .case video { width: 100%; max-height: 260px; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  .case figure.wide video { max-height: 420px; }
  #history .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #history h2 { font-size: 22px; letter-spacing: -.02em; margin: 0; }
  .hist-sub { color: var(--muted); margin: 4px 0 16px; }
  #hist-filter { font: inherit; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--accent); border: 1px solid var(--line-strong); }
  .badge.animate { color: var(--red); }
  .case .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .case .meta-row a { margin-left: auto; color: var(--accent); }
  .case .fname { overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg viewBox="0 0 560 120" role="img" aria-label="CYHIA — Human Image Animation">
      <path d="M40 16 L14 60 L40 104 L58 104 L32 60 L58 16Z" fill="#bc0424"/>
      <path d="M62 8 L30 60 L62 112 L86 112 L54 60 L86 8Z" fill="#3a59d9"/>
      <text x="104" y="84" font-family="system-ui,'Segoe UI',Arial,sans-serif" font-weight="800" font-size="84" letter-spacing="2" fill="var(--wordmark)">CYHIA</text>
      <text x="108" y="112" font-family="system-ui,'Segoe UI',Arial,sans-serif" font-weight="600" font-size="15" letter-spacing="4.5" fill="var(--muted)">HUMAN IMAGE ANIMATION</text>
    </svg>
  </header>

  <section class="hero">
    <h1>Human image animation, <span>on your own GPUs.</span></h1>
    <p>Replace a character in a video, or animate a still image from a driving video, from one interface.</p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="replace" aria-selected="true"><span class="dot" data-dot="replace"></span>Replace character</button>
    <button role="tab" data-tab="animate" aria-selected="false"><span class="dot" data-dot="animate"></span>Animate</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
  </nav>

  <template id="panel-tpl">
    <section class="panel" role="tabpanel">
      <div class="status"><span class="dot"></span><span class="status-text">Checking…</span></div>
      <p class="blurb"></p>
      <details class="card guide" open>
        <summary>Input guide: how to choose your image and video</summary>
        <div class="cols">
          <div><h3>Reference image</h3><ul class="do img-do"></ul><ul class="avoid img-avoid" style="margin-top:8px"></ul></div>
          <div><h3>Driving video</h3><ul class="do vid-do"></ul><ul class="avoid vid-avoid" style="margin-top:8px"></ul></div>
          <div><h3>Limits</h3><table class="limits"></table></div>
        </div>
        <p class="tip"></p>
      </details>
      <div class="grid">
        <div class="card">
          <div class="label">Reference character (image)</div>
          <div class="drop" data-kind="image">
            <input type="file" accept="image/*">
            <div class="hint"><strong>Drop an image or click to choose</strong>PNG, JPG or WebP</div>
            <button type="button" class="clear">Remove</button>
          </div>
          <div class="label">Driving video (provides the motion)</div>
          <div class="drop" data-kind="video">
            <input type="file" accept="video/*">
            <div class="hint"><strong>Drop a video or click to choose</strong>MP4, MOV or WebM</div>
            <button type="button" class="clear">Remove</button>
          </div>
          <button class="go" disabled>Generate</button>
        </div>
        <div class="card result">
          <div class="label">Result</div>
          <div class="error" hidden></div>
          <div class="progress" hidden>
            <div><span class="stage"></span> <span class="meta"></span></div>
            <div class="bar"><i></i></div>
          </div>
          <div class="empty">The result will appear here.</div>
          <div class="out" hidden>
            <video controls playsinline></video>
            <a class="dl" download>Download video</a>
          </div>
        </div>
      </div>
    </section>
  </template>
  <div id="panels"></div>

  <section id="history" hidden>
    <div class="hist-head">
      <h2>Previous runs</h2>
      <select id="hist-filter" aria-label="Filter by service">
        <option value="">All services</option><option value="replace">Replace</option><option value="animate">Animate</option>
      </select>
    </div>
    <p class="hist-sub">Every finished result stored by this UI, newest first. Kept on disk, so it survives a restart.</p>
    <div class="cases" id="hist-list"></div>
    <p class="empty" id="hist-empty" hidden>No finished runs yet.</p>
  </section>

  <section class="gallery" id="gallery" hidden>
    <h2>Gallery</h2>
    <p class="gallery-sub"></p>
    <div class="cases"></div>
  </section>
</main>

<script>
"use strict";

const SERVICES = {
  replace: "Puts the character from your image into the driving video, matching pose, " +
           "framing and lighting. The result is shown side by side with the original, " +
           "with the original audio. A full-length clip takes roughly an hour.",
  animate: "Animates the character in your image using the motion of the driving video.",
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const minutes = s => s < 60 ? `${Math.round(s)} s` : `${(s / 60).toFixed(1)} min`;

const GUIDE = {
  replace: {
    imgDo: ["One person, clearly visible, face and body in frame",
            "Similar framing to the video (full body for a full-body video, half body for a half body)",
            "Sharp and evenly lit; the face and outfit are copied from here",
            "Roughly the same body shape and pose direction as the person you are replacing"],
    imgAvoid: ["Several people, heavy filters or strong shadows across the face",
               "Sunglasses, masks or hands covering the face",
               "Tiny or heavily cropped subjects, very low resolution"],
    vidDo: ["The person you want replaced is the main subject and the closest to the camera",
            "Fixed or slowly moving camera, the whole body visible for most of the clip",
            "Good lighting and little motion blur, so the pose can be read",
            "Original audio is kept and returned with the result"],
    vidAvoid: ["Crowds: other people are removed, but only the main person is tracked (up to 5 are detected)",
               "Fast cuts and scene changes; use a single continuous shot",
               "Objects held in hand: they are removed, so avoid clips where the prop matters",
               "Heavy occlusion or the subject leaving the frame"],
    limits: [["Image", "PNG, JPG, JPEG, WebP or BMP"],
             ["Video", "MP4, MOV, WebM, MKV, AVI or M4V"],
             ["Frame rate", "Resampled to 24 fps"],
             ["Length", "Up to 1140 frames (about 47 s at 24 fps); longer clips are cut off"],
             ["Time", "About 3 min plus roughly 3.3 s per frame: a full 1140-frame clip takes 65–70 min"]],
    tip: "First time? Trim the driving video to a few seconds. A 49-frame test takes about 6 minutes and shows whether the image and video pair well before you commit to an hour-long run.",
  },
  animate: {
    imgDo: ["One character, front or three-quarter view, face clearly visible",
            "Sharp, evenly lit, uncluttered background",
            "Pose and framing close to the first frame of the driving video",
            "Enough of the body in the image for the motion you want (full body for dancing or walking)"],
    imgAvoid: ["Several people or a face that is small, blurred or covered",
               "A pose very different from the video's opening pose",
               "Heavy stylisation that hides anatomy"],
    vidDo: ["One person performing the motion, whole body in frame",
            "Steady camera and a plain, well-lit scene",
            "Clear limb and face movement; the video's motion and expression are transferred",
            "Portrait or landscape matching the image gives the cleanest result"],
    vidAvoid: ["Several people in shot", "Cuts, zooms and fast camera moves",
               "Motion blur or dark footage", "Limbs leaving the frame"],
    limits: [["Image", "PNG, JPG, JPEG, WebP or BMP"],
             ["Video", "MP4, MOV, WebM, MKV, AVI or M4V"],
             ["Frame rate", "Resampled to 24 fps"],
             ["Length", "Up to 240 frames (about 10 s at 24 fps); longer clips are cut off"],
             ["Time", "About 6 minutes for a 49-frame clip; a full 240-frame clip takes longer"]],
    tip: "The output is the character from your image performing the video's motion. Choose the video for its motion and the image for its identity; the video's background is not carried over.",
  },
};

function makePanel(service) {
  const el = document.getElementById("panel-tpl").content.firstElementChild.cloneNode(true);
  el.dataset.panel = service;
  el.querySelector(".blurb").textContent = SERVICES[service];
  const $ = s => el.querySelector(s);
  const g = GUIDE[service];
  const fill = (sel, items) => items.forEach(t => { const li = document.createElement("li"); li.textContent = t; $(sel).append(li); });
  fill(".img-do", g.imgDo); fill(".img-avoid", g.imgAvoid);
  fill(".vid-do", g.vidDo); fill(".vid-avoid", g.vidAvoid);
  g.limits.forEach(([k, v]) => { const tr = $(".limits").insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; });
  $(".tip").textContent = g.tip;
  const files = { image: null, video: null };
  const go = $(".go");
  let busy = false, pollTimer = null;

  // ── inputs ────────────────────────────────────────────────────────────────
  el.querySelectorAll(".drop").forEach(drop => {
    const kind = drop.dataset.kind, input = drop.querySelector("input");
    let url = null;
    const set = file => {
      if (url) URL.revokeObjectURL(url);
      drop.querySelector("img,video")?.remove();
      files[kind] = file || null;
      drop.classList.toggle("has", !!file);
      if (file) {
        url = URL.createObjectURL(file);
        const m = document.createElement(kind === "image" ? "img" : "video");
        m.src = url;
        if (kind === "video") { m.muted = true; m.controls = true; m.playsInline = true; }
        drop.prepend(m);
      }
      // A preview element sits over the input; keep the input clickable only when empty.
      input.style.display = file ? "none" : "";
      refresh();
    };
    input.addEventListener("change", () => set(input.files[0]));
    drop.querySelector(".clear").addEventListener("click", e => {
      e.preventDefault(); input.value = ""; set(null);
    });
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault(); drop.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith(kind + "/")) set(f);
    });
  });

  function refresh() { go.disabled = busy || !files.image || !files.video; }

  // ── output side ───────────────────────────────────────────────────────────
  function show({ error = null, stage = null, meta = "", fraction = null, result = null, filename = null }) {
    $(".error").hidden = !error; $(".error").textContent = error || "";
    $(".progress").hidden = !stage;
    if (stage) {
      $(".stage").textContent = stage; $(".meta").textContent = meta;
      $(".bar").classList.toggle("spin", fraction == null);
      $(".bar > i").style.width = fraction == null ? "" : `${Math.round(fraction * 100)}%`;
    }
    $(".out").hidden = !result;
    $(".empty").hidden = !!(stage || result);
    if (result) {
      const v = $(".out video");
      if (v.getAttribute("src") !== result) v.src = result;
      $(".dl").href = result; $(".dl").download = filename || "result.mp4";
    }
  }

  function setBusy(b) { busy = b; go.textContent = b ? "Working…" : "Generate"; refresh(); }

  // ── running a job ─────────────────────────────────────────────────────────
  go.addEventListener("click", () => {
    const fd = new FormData();
    fd.append("image", files.image);
    fd.append("video", files.video);
    setBusy(true);
    show({ stage: "Uploading", meta: "0%", fraction: 0 });

    // XHR rather than fetch: upload progress is the one honest fraction we have.
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `/api/${service}/jobs`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) show({ stage: "Uploading", meta: `${Math.round(e.loaded / e.total * 100)}%`, fraction: e.loaded / e.total });
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status !== 200) {
        setBusy(false);
        show({ error: body.detail || `Upload failed (HTTP ${xhr.status}).` });
        return;
      }
      store.set(`job:${service}`, body.id);
      track(body.id);
    };
    xhr.onerror = () => { setBusy(false); show({ error: "Upload failed: the UI server could not be reached." }); };
    xhr.send(fd);
  });

  function track(id) {
    setBusy(true);
    clearTimeout(pollTimer);
    const poll = async () => {
      let job;
      try {
        const r = await fetch(`/api/jobs/${id}`);
        job = await r.json();
        if (!r.ok) throw new Error(job.detail || `HTTP ${r.status}`);
      } catch (e) {
        if (String(e.message).startsWith("Unknown job")) {
          store.set(`job:${service}`, null); setBusy(false);
          show({ error: `Lost track of the job: ${e.message}` });
          return;
        }
        pollTimer = setTimeout(poll, 5000);       // UI server blip: keep trying
        return;
      }
      if (job.state === "done") {
        store.set(`job:${service}`, null); setBusy(false);
        show({ result: job.result, filename: job.filename });
        return;
      }
      if (job.state === "error") {
        store.set(`job:${service}`, null); setBusy(false);
        show({ error: job.error });
        return;
      }
      if (job.state === "queued") {
        show({ stage: "Waiting for the GPU", meta: job.ahead ? `· ${job.ahead} job${job.ahead > 1 ? "s" : ""} ahead` : "" });
      } else {
        // Stage name + elapsed, not a percentage: see CLAUDE.md.
        const step = job.steps ? ` · step ${job.step}/${job.steps}` : "";
        show({ stage: job.stage, meta: `${step} · ${minutes(job.elapsed)} elapsed`,
               fraction: job.steps ? job.step / job.steps : null });
      }
      pollTimer = setTimeout(poll, 2000);
    };
    poll();
  }

  const resume = store.get(`job:${service}`);
  if (resume) { show({ stage: "Reconnecting to your job", meta: "" }); track(resume); }
  return el;
}

// ── tabs ────────────────────────────────────────────────────────────────────
const panels = document.getElementById("panels");
for (const s of Object.keys(SERVICES)) panels.append(makePanel(s));
async function loadGallery(service) {
  const box = document.getElementById("gallery");
  let cases = [];
  try { cases = (await (await fetch("/api/gallery")).json())[service] || []; } catch {}
  box.hidden = !cases.length;
  const list = box.querySelector(".cases");
  list.replaceChildren();
  box.querySelector(".gallery-sub").textContent = service === "replace"
    ? "Examples of character replacement: the result is your reference character in the driving video's scene."
    : "Examples of animation: the reference image performing the driving video's motion.";
  const fig = (label, tag, src, wide) => {
    if (!src) return null;
    const f = document.createElement("figure"), c = document.createElement("figcaption"), m = document.createElement(tag);
    if (wide) f.className = "wide";
    c.textContent = label; m.src = src;
    if (tag === "video") { m.controls = true; m.muted = true; m.loop = true; m.playsInline = true; m.preload = "metadata"; }
    f.append(c, m);
    return f;
  };
  for (const c of cases) {
    const card = document.createElement("article"); card.className = "card case";
    const h = document.createElement("h3"); h.textContent = c.title; card.append(h);
    if (c.note) { const n = document.createElement("p"); n.className = "note"; n.textContent = c.note; card.append(n); }
    const trio = document.createElement("div"); trio.className = "trio";
    trio.append(...[fig("Reference", "img", c.image), fig("Driving video", "video", c.video),
                    fig("Result", "video", c.result, true)].filter(Boolean));
    card.append(trio); list.append(card);
  }
}

let history = [];
async function loadHistory() {
  try { history = await (await fetch("/api/history")).json(); } catch { history = []; }
  renderHistory();
}
function renderHistory() {
  const want = document.getElementById("hist-filter").value;
  const rows = history.filter(r => !want || r.service === want);
  const list = document.getElementById("hist-list");
  list.replaceChildren();
  document.getElementById("hist-empty").hidden = rows.length > 0;
  for (const r of rows) {
    const card = document.createElement("article"); card.className = "card case";
    const row = document.createElement("div"); row.className = "meta-row";
    const b = document.createElement("span"); b.className = `badge ${r.service}`; b.textContent = r.service;
    const when = document.createElement("span"); when.textContent = new Date(r.finished * 1000).toLocaleString();
    const size = document.createElement("span"); size.textContent = `${(r.size / 1048576).toFixed(1)} MB`;
    const dl = document.createElement("a"); dl.href = r.url; dl.download = r.name; dl.textContent = "Download";
    row.append(b, when, size, dl);
    const name = document.createElement("p"); name.className = "note fname"; name.textContent = r.name;
    const v = document.createElement("video");
    v.src = r.url; v.controls = true; v.playsInline = true; v.preload = "metadata";
    card.append(row, name, v); list.append(card);
  }
}
document.getElementById("hist-filter").addEventListener("change", renderHistory);

function selectTab(name) {
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  const isHist = name === "history";
  document.getElementById("history").hidden = !isHist;
  if (isHist) { document.getElementById("gallery").hidden = true; loadHistory(); }
  else loadGallery(name);
  store.set("tab", name);
}
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => selectTab(b.dataset.tab)));
selectTab(SERVICES[store.get("tab")] || store.get("tab") === "history" ? store.get("tab") : "replace");

// ── backend status ──────────────────────────────────────────────────────────
// Polled so a tab shows as offline before anyone presses Generate.
async function pollStatus() {
  try {
    const st = await (await fetch("/api/status")).json();
    for (const [name, s] of Object.entries(st)) {
      document.querySelectorAll(`[data-dot="${name}"], [data-panel="${name}"] .status .dot`)
        .forEach(d => d.className = `dot ${s.state}`);
      const t = document.querySelector(`[data-panel="${name}"] .status-text`);
      t.innerHTML = "";
      const b = document.createElement("b"); b.textContent = s.label;
      t.append(b, ` — ${s.detail}`);
    }
  } catch {}
  setTimeout(pollStatus, 15000);
}
pollStatus();
